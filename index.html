<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMVM Docent Tour Request Tracker</title>
<style>
  :root {
    --navy: #1f2a3d;
    --navy-light: #2e3d57;
    --parchment: #f7f5f0;
    --card: #ffffff;
    --ink: #22252a;
    --muted: #6b7280;
    --line: #e3e0d8;
    --gold: #b08d3e;
    --green: #2f6b3c;
    --green-bg: #e8f2ea;
    --amber: #8a6116;
    --amber-bg: #f7edd8;
    --blue: #2b5d8a;
    --blue-bg: #e5eef6;
    --gray-bg: #ececec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: var(--parchment);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    background: var(--navy);
    color: #f2efe8;
    padding: 28px 24px 22px;
    border-bottom: 4px solid var(--gold);
  }
  .header-inner { max-width: 860px; margin: 0 auto; }
  header h1 {
    font-size: 26px;
    font-weight: normal;
    letter-spacing: 0.5px;
  }
  header .subtitle {
    font-size: 14px;
    color: #c9c3b4;
    margin-top: 4px;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 24px; }
  .summary {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 20px;
    min-width: 130px;
  }
  .stat .num { font-size: 26px; color: var(--navy); }
  .stat .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: Arial, sans-serif;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-family: Arial, sans-serif;
  }
  .filters button {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
  }
  .filters button.active {
    background: var(--navy);
    color: #f2efe8;
    border-color: var(--navy);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--navy-light);
    border-radius: 6px;
    padding: 22px 26px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(31,42,61,0.07);
  }
  .card.confirmed { border-left-color: var(--green); }
  .card.pending { border-left-color: var(--amber); }
  .card.accepted { border-left-color: var(--blue); }
  .card.awaiting { border-left-color: var(--muted); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .req-num {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .card h2 { font-size: 20px; font-weight: normal; color: var(--navy); margin: 2px 0 10px; }
  .badge {
    font-family: Arial, sans-serif;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .badge.confirmed { background: var(--green-bg); color: var(--green); }
  .badge.pending { background: var(--amber-bg); color: var(--amber); }
  .badge.accepted { background: var(--blue-bg); color: var(--blue); }
  .badge.awaiting { background: var(--gray-bg); color: #555; }
  .when {
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .when strong { color: var(--navy); }
  .fields {
    display: grid;
    grid-template-columns: 170px 1fr;
    row-gap: 8px;
    column-gap: 16px;
    font-size: 14.5px;
  }
  .fields dt {
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding-top: 2px;
  }
  .fields dd { color: var(--ink); }
  .notes {
    margin-top: 14px;
    padding: 12px 14px;
    background: #faf8f3;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
    color: #4a4d52;
  }
  footer {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    padding: 10px 0 30px;
    font-family: Arial, sans-serif;
  }
  @media (max-width: 560px) {
    .fields { grid-template-columns: 1fr; row-gap: 2px; }
    .fields dt { margin-top: 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Docent Tour Request Tracker</h1>
    <div class="subtitle">Minnesota Military &amp; Veterans Museum &mdash; interim system pending permanent software solution</div>
  </div>
</header>
<div class="container">
  <div class="summary" id="summary"></div>
  <div class="filters" id="filters"></div>
  <div id="cards"></div>
</div>
<footer>Last updated: July 25, 2026 &middot; Maintained by Buddy Winn &middot; Source: email requests via Kevin Olson, MMVM</footer>
<script>
const requests = [
  {
    num: 3,
    org: "MN ARNG OCS Candidates",
    purpose: "Pre-opening preview visit",
    tourDate: "Saturday, July 25, 2026",
    tourTime: "1:00 PM",
    sortDate: "2026-07-25",
    size: "20",
    received: "July 23, 2026",
    source: "Kevin Olson, coordinating with LTC Mindy Davis",
    poc: "LTC Mindy Davis, Government Relations Officer, MN National Guard",
    contact: "On file with tour coordinator",
    docents: "Buddy Winn",
    status: "Confirmed",
    statusClass: "confirmed",
    notes: "Buddy on site 1:00 PM to meet the group. Kevin and Randal unavailable that day."
  },
  {
    num: 4,
    org: "Congressman Stauber and Team",
    purpose: "Museum visit while in the area",
    tourDate: "August 3, 2026 (tentative)",
    tourTime: "TBD",
    sortDate: "2026-08-03",
    size: "TBD",
    received: "July 23, 2026",
    source: "LTC Mindy Davis, via OCS tour thread",
    poc: "Congressman Stauber's staff (details pending)",
    contact: "On file with tour coordinator",
    docents: "TBD",
    status: "Awaiting details",
    statusClass: "awaiting",
    notes: "Mindy connecting Stauber's staff with Kevin for coordination. Buddy tracking with Kevin."
  },
  {
    num: 1,
    org: "US Navy Chiefs and Chief Selects",
    purpose: "Training at Camp Ripley; history and heritage emphasis",
    tourDate: "September 14&ndash;16, 2026 (exact day TBD)",
    tourTime: "Flexible",
    sortDate: "2026-09-14",
    size: "25&ndash;40",
    received: "July 14, 2026",
    source: "Kevin Olson, fwd from Sandy Erickson; original inquiry July 11",
    poc: "HMCS (EXW/IW) Kevin Blake",
    contact: "On file with tour coordinator",
    docents: "TBD &mdash; Jim Palmer requested (served USS Minneapolis / Saint Paul)",
    status: "Pending docent",
    statusClass: "pending",
    notes: "Docent request out as of July 19. Group hours flexible. Advise Kevin Olson once docent confirmed."
  },
  {
    num: 2,
    org: "Rosemount Beyond the Yellow Ribbon",
    purpose: "Guided group tour",
    tourDate: "Thursday, September 24, 2026",
    tourTime: "10:30 AM",
    sortDate: "2026-09-24",
    size: "~55",
    received: "July 16, 2026",
    source: "Kevin Olson",
    poc: "Kevin Olson, relaying; group POC TBD",
    contact: "kolson@mnmilitarymuseum.org | 651-212-0573",
    docents: "Buddy Winn (lead); additional docents invited to observe",
    status: "Accepted",
    statusClass: "accepted",
    notes: "Buddy leading; docents observing as primary exhibit scripts are test-fired. Large group; consider splitting into sections."
  }
];

let activeFilter = "All";

function renderSummary() {
  const total = requests.length;
  const confirmed = requests.filter(r => r.statusClass === "confirmed").length;
  const open = requests.filter(r => r.statusClass === "pending" || r.statusClass === "awaiting").length;
  const upcoming = requests.filter(r => r.sortDate >= "2026-07-25").length;
  document.getElementById("summary").innerHTML =
    '<div class="stat"><div class="num">' + total + '</div><div class="label">Total requests</div></div>' +
    '<div class="stat"><div class="num">' + confirmed + '</div><div class="label">Confirmed</div></div>' +
    '<div class="stat"><div class="num">' + open + '</div><div class="label">Needing action</div></div>' +
    '<div class="stat"><div class="num">' + upcoming + '</div><div class="label">Upcoming tours</div></div>';
}

function renderFilters() {
  const statuses = ["All", "Confirmed", "Accepted", "Pending docent", "Awaiting details"];
  document.getElementById("filters").innerHTML = statuses.map(s =>
    '<button class="' + (s === activeFilter ? "active" : "") + '" onclick="setFilter(\'' + s + '\')">' + s + '</button>'
  ).join("");
}

function setFilter(s) {
  activeFilter = s;
  renderFilters();
  renderCards();
}

function renderCards() {
  const list = requests
    .filter(r => activeFilter === "All" || r.status === activeFilter)
    .sort((a, b) => a.sortDate.localeCompare(b.sortDate));
  document.getElementById("cards").innerHTML = list.map(r =>
    '<div class="card ' + r.statusClass + '">' +
      '<div class="card-top">' +
        '<div><div class="req-num">Request No. ' + r.num + '</div>' +
        '<h2>' + r.org + '</h2></div>' +
        '<span class="badge ' + r.statusClass + '">' + r.status + '</span>' +
      '</div>' +
      '<div class="when"><strong>' + r.tourDate + '</strong> at <strong>' + r.tourTime + '</strong> &middot; ' + r.size + ' guests</div>' +
      '<dl class="fields">' +
        '<dt>Purpose</dt><dd>' + r.purpose + '</dd>' +
        '<dt>Date received</dt><dd>' + r.received + '</dd>' +
        '<dt>Source</dt><dd>' + r.source + '</dd>' +
        '<dt>Group POC</dt><dd>' + r.poc + '</dd>' +
        '<dt>POC contact</dt><dd>' + r.contact + '</dd>' +
        '<dt>Docent(s)</dt><dd>' + r.docents + '</dd>' +
      '</dl>' +
      (r.notes ? '<div class="notes">' + r.notes + '</div>' : '') +
    '</div>'
  ).join("");
}

renderSummary();
renderFilters();
renderCards();
</script>
</body>
</html>
