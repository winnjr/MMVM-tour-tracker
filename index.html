<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMVM Docent Tour Request Tracker</title>
<style>
  :root {
    --navy: #1f2a3d;
    --navy-light: #2e3d57;
    --parchment: #f7f5f0;
    --card: #ffffff;
    --ink: #22252a;
    --muted: #6b7280;
    --line: #e3e0d8;
    --gold: #b08d3e;
    --green: #2f6b3c;
    --green-bg: #e8f2ea;
    --amber: #8a6116;
    --amber-bg: #f7edd8;
    --blue: #2b5d8a;
    --blue-bg: #e5eef6;
    --gray-bg: #ececec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: var(--parchment);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    background: var(--navy);
    color: #f2efe8;
    padding: 28px 24px 22px;
    border-bottom: 4px solid var(--gold);
  }
  .header-inner { max-width: 860px; margin: 0 auto; }
  header h1 {
    font-size: 26px;
    font-weight: normal;
    letter-spacing: 0.5px;
  }
  header .subtitle {
    font-size: 14px;
    color: #c9c3b4;
    margin-top: 4px;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 24px; }
  .summary {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 20px;
    min-width: 130px;
  }
  .stat .num { font-size: 26px; color: var(--navy); }
  .stat .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filters button {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
    font-family: Arial, sans-serif;
  }
  .filters button.active {
    background: var(--navy);
    color: #f2efe8;
    border-color: var(--navy);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--navy-light);
    border-radius: 6px;
    padding: 22px 26px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(31,42,61,0.07);
  }
  .card.confirmed { border-left-color: var(--green); }
  .card.pending { border-left-color: var(--amber); }
  .card.accepted { border-left-color: var(--blue); }
  .card.awaiting { border-left-color: var(--muted); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .req-num {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .card h2 { font-size: 20px; font-weight: normal; color: var(--navy); margin: 2px 0 10px; }
  .card h2 a { color: var(--navy); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .back-btn {
    display: inline-block;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
    text-decoration: none;
    font-family: Arial, sans-serif;
  }
  .back-btn:hover { background: var(--navy); color: #f2efe8; border-color: var(--navy); }
  .mail-btn {
    display: inline-block;
    margin-top: 14px;
    border: 1px solid var(--navy-light);
    background: var(--navy-light);
    color: #f2efe8;
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    font-family: Arial, sans-serif;
  }
  .mail-btn:hover { background: var(--navy); border-color: var(--navy); }
  .cover-btn {
    display: inline-block;
    margin-top: 14px;
    margin-left: 8px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #ffffff;
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    font-family: Arial, sans-serif;
  }
  .cover-btn:hover { background: #24522e; border-color: #24522e; }
  .filters button.toggle { border-color: var(--gold); }
  .filters button.toggle.active { background: var(--gold); border-color: var(--gold); color: #fff; }
  .badge {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .badge.confirmed { background: var(--green-bg); color: var(--green); }
  .badge.pending { background: var(--amber-bg); color: var(--amber); }
  .badge.accepted { background: var(--blue-bg); color: var(--blue); }
  .badge.awaiting { background: var(--gray-bg); color: #555; }
  .when {
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .when strong { color: var(--navy); }
  .fields {
    display: grid;
    grid-template-columns: 170px 1fr;
    row-gap: 8px;
    column-gap: 16px;
    font-size: 14.5px;
  }
  .fields dt {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding-top: 2px;
  }
  .fields dd { color: var(--ink); }
  .notes {
    margin-top: 14px;
    padding: 12px 14px;
    background: #faf8f3;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
    color: #4a4d52;
  }
  .comments {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--green-bg);
    border: 1px solid #c9dfcd;
    border-radius: 4px;
    font-size: 14px;
    color: #2c4a33;
  }
  .comments .comments-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--green);
    margin-bottom: 4px;
  }
  .loading, .error {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 15px;
  }
  .error { color: #8a3030; }
  footer {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    padding: 10px 0 30px;
  }
  @media (max-width: 560px) {
    .fields { grid-template-columns: 1fr; row-gap: 2px; }
    .fields dt { margin-top: 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Docent Tour Request Tracker</h1>
    <div class="subtitle">Minnesota Military &amp; Veterans Museum &mdash; interim system pending permanent software solution</div>
  </div>
</header>
<div class="container">
  <div class="summary" id="summary"></div>
  <div class="filters" id="filters"></div>
  <div id="cards"><div class="loading">Loading tour requests...</div></div>
</div>
<footer id="foot">Maintained by Buddy Winn &middot; Data refreshes automatically each time this page is opened</footer>
<script>
var SHEET_ID = "1Xaw20ubhWldHclfIVvDKmOGPQVVS6pCp9EXE3XBqPpU";
var CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv";

var requests = [];
var activeFilter = "All";
var hideCompleted = false;

function singleNum() {
  var m = location.hash.match(/^#req-(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}

function isCompleted(r) {
  return (r.status || "").toLowerCase().indexOf("complet") >= 0;
}

function gmailUrl(r) {
  var subject = "MMVM Tour Request No. " + r.num + " - " + r.org + " - " + r.tourDate;
  var body =
    "Tour request details from the MMVM Docent Tour Request Tracker:\n\n" +
    "Request No.: " + r.num + "\n" +
    "Organization: " + r.org + "\n" +
    "Purpose: " + r.purpose + "\n" +
    "Tour date: " + r.tourDate + "\n" +
    "Tour time: " + r.tourTime + "\n" +
    "Group size: " + r.size + "\n" +
    "Group POC: " + r.poc + "\n" +
    "POC contact: " + r.contact + "\n" +
    "Docent(s): " + r.docents + "\n" +
    "Status: " + r.status + "\n" +
    (r.notes ? "Notes: " + r.notes + "\n" : "") +
    "\nTracker link: https://winnjr.github.io/MMVM-tour-tracker/#req-" + encodeURIComponent(r.num) + "\n";
  return "https://mail.google.com/mail/?view=cm&fs=1&su=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

function coverUrl(r) {
  var subject = "Available to cover Tour Request No. " + r.num + " - " + r.org + " - " + r.tourDate;
  var body =
    "Buddy,\n\n" +
    "I am available to cover this tour:\n\n" +
    "Request No.: " + r.num + "\n" +
    "Organization: " + r.org + "\n" +
    "Tour date: " + r.tourDate + " at " + r.tourTime + "\n" +
    "Group size: " + r.size + "\n\n" +
    "Name: \n" +
    "Best phone number: \n" +
    "Notes or schedule limits: \n";
  return "mailto:winnjr@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

function parseCSV(text) {
  var rows = [], row = [], field = "", inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); field = ""; if (row.some(function(f){return f !== "";})) rows.push(row); row = []; }
      else if (c === '\r') { }
      else { field += c; }
    }
  }
  if (field !== "" || row.length) { row.push(field); if (row.some(function(f){return f !== "";})) rows.push(row); }
  return rows;
}

function statusClass(status) {
  var s = (status || "").toLowerCase();
  if (s.indexOf("confirm") >= 0 || s.indexOf("complete") >= 0) return "confirmed";
  if (s.indexOf("pend") >= 0) return "pending";
  if (s.indexOf("accept") >= 0) return "accepted";
  return "awaiting";
}

function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function load() {
  fetch(CSV_URL).then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function(text) {
    var rows = parseCSV(text);
    if (rows.length < 2) throw new Error("No data rows found");
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    function col(name) { return header.indexOf(name.toLowerCase()); }
    var idx = {
      num: col("Req #"), org: col("Organization"), purpose: col("Purpose"),
      tourDate: col("Tour Date"), tourTime: col("Tour Time"), sortDate: col("Sort Date"),
      size: col("Group Size"), received: col("Date Received"), source: col("Source"),
      poc: col("Group POC"), contact: col("POC Contact"), docents: col("Docents"),
      status: col("Status"), notes: col("Notes"), comments: col("Tour Comments"),
      needed: col("Docents Needed")
    };
    requests = rows.slice(1).map(function(r) {
      function g(k) { return idx[k] >= 0 ? (r[idx[k]] || "").trim() : ""; }
      return {
        num: g("num"), org: g("org"), purpose: g("purpose"),
        tourDate: g("tourDate"), tourTime: g("tourTime"), sortDate: g("sortDate"),
        size: g("size"), received: g("received"), source: g("source"),
        poc: g("poc"), contact: g("contact"), docents: g("docents"),
        status: g("status") || "Awaiting details", notes: g("notes"),
        comments: g("comments"), needed: g("needed"),
        statusClass: statusClass(g("status"))
      };
    }).filter(function(r) { return r.org !== ""; });
    renderSummary();
    renderFilters();
    renderCards();
  }).catch(function(err) {
    document.getElementById("cards").innerHTML =
      '<div class="error">Could not load tour request data (' + esc(err.message) + ').<br>' +
      'The data sheet must be shared as "Anyone with the link - Viewer". Refresh to retry.</div>';
  });
}

function renderSummary() {
  var total = requests.length;
  var completed = requests.filter(isCompleted).length;
  var confirmed = requests.filter(function(r){ return r.statusClass === "confirmed" && !isCompleted(r); }).length;
  var open = requests.filter(function(r){ return r.statusClass === "pending" || r.statusClass === "awaiting"; }).length;
  var today = new Date();
  var iso = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" + String(today.getDate()).padStart(2,"0");
  var upcoming = requests.filter(function(r){ return r.sortDate >= iso; }).length;
  document.getElementById("summary").innerHTML =
    '<div class="stat"><div class="num">' + total + '</div><div class="label">Total requests</div></div>' +
    '<div class="stat"><div class="num">' + confirmed + '</div><div class="label">Confirmed</div></div>' +
    '<div class="stat"><div class="num">' + open + '</div><div class="label">Needing action</div></div>' +
    '<div class="stat"><div class="num">' + upcoming + '</div><div class="label">Upcoming tours</div></div>' +
    '<div class="stat"><div class="num">' + completed + '</div><div class="label">Completed</div></div>';
}

function renderFilters() {
  if (singleNum()) { document.getElementById("filters").innerHTML = ""; return; }
  var statuses = ["All"];
  requests.forEach(function(r) { if (statuses.indexOf(r.status) < 0) statuses.push(r.status); });
  var html = statuses.map(function(s) {
    return '<button class="' + (s === activeFilter ? "active" : "") + '" onclick="setFilter(\'' + esc(s).replace(/'/g, "\\'") + '\')">' + esc(s) + '</button>';
  }).join("");
  html += '<button class="toggle' + (hideCompleted ? " active" : "") + '" onclick="toggleCompleted()">' +
    (hideCompleted ? "Showing open only" : "Hide completed") + '</button>';
  document.getElementById("filters").innerHTML = html;
}

function setFilter(s) {
  activeFilter = s;
  renderFilters();
  renderCards();
}

function toggleCompleted() {
  hideCompleted = !hideCompleted;
  renderFilters();
  renderCards();
}

function renderCards() {
  var single = singleNum();
  var list;
  var backBtn = "";
  if (single !== null) {
    list = requests.filter(function(r) { return String(r.num) === String(single); });
    backBtn = '<a class="back-btn" href="#" onclick="location.hash=\'\'; return false;">&larr; All requests</a>';
    if (!list.length) {
      document.getElementById("cards").innerHTML = backBtn + '<div class="loading">Request No. ' + esc(single) + ' was not found.</div>';
      return;
    }
  } else {
    list = requests.filter(function(r) {
      if (activeFilter !== "All" && r.status !== activeFilter) return false;
      if (hideCompleted && isCompleted(r)) return false;
      return true;
    });
  }
  list = list.slice().sort(function(a, b) { return (a.sortDate || "9999").localeCompare(b.sortDate || "9999"); });
  if (!list.length) {
    document.getElementById("cards").innerHTML = backBtn + '<div class="loading">No tour requests to show.</div>';
    return;
  }
  document.getElementById("cards").innerHTML = backBtn + list.map(function(r) {
    return '<div class="card ' + r.statusClass + '">' +
      '<div class="card-top">' +
        '<div><div class="req-num">Request No. ' + esc(r.num) + '</div>' +
        '<h2><a href="#req-' + encodeURIComponent(r.num) + '" title="View this request by itself">' + esc(r.org) + '</a></h2></div>' +
        '<span class="badge ' + r.statusClass + '">' + esc(r.status) + '</span>' +
      '</div>' +
      '<div class="when"><strong>' + esc(r.tourDate) + '</strong> at <strong>' + esc(r.tourTime) + '</strong> &middot; ' + esc(r.size) + ' guests' +
        (r.needed ? ' &middot; <strong>' + esc(r.needed) + '</strong> docent' + (r.needed === "1" ? "" : "s") + ' needed' : '') + '</div>' +
      '<dl class="fields">' +
        '<dt>Purpose</dt><dd>' + esc(r.purpose) + '</dd>' +
        '<dt>Date received</dt><dd>' + esc(r.received) + '</dd>' +
        '<dt>Source</dt><dd>' + esc(r.source) + '</dd>' +
        '<dt>Group POC</dt><dd>' + esc(r.poc) + '</dd>' +
        '<dt>POC contact</dt><dd>' + esc(r.contact) + '</dd>' +
        '<dt>Docent(s)</dt><dd>' + esc(r.docents) + '</dd>' +
      '</dl>' +
      (r.notes ? '<div class="notes">' + esc(r.notes) + '</div>' : '') +
      (r.comments ? '<div class="comments"><div class="comments-label">Tour comments</div>' + esc(r.comments) + '</div>' : '') +
      '<a class="mail-btn" href="' + gmailUrl(r).replace(/"/g, "&quot;") + '" target="_blank" rel="noopener">Email this request</a>' +
      (isCompleted(r) ? '' : '<a class="cover-btn" href="' + coverUrl(r).replace(/"/g, "&quot;") + '">I can cover this tour</a>') +
    '</div>';
  }).join("");
}

window.addEventListener("hashchange", function() {
  renderFilters();
  renderCards();
});

load();
</script>
</body>
</html>
